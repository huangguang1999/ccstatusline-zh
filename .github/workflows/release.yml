name: Release

# main 上 package.json 版本号变化时触发（sync PR 合并即是）。
# 若版本比 npm 上的新，则构建并发布到 npm，再打 tag、开 GitHub Release。
#
# publish 任务挂在受保护的 `npm-publish` Environment 上：
# 配置了「必需审批人」后，这一步会暂停并通知你，点一下批准才会真正发布。
#
# npm 鉴权用 Trusted Publishing（OIDC）：GitHub Actions 每次发布时换取短期凭据，
# 不需要长期 token，也就不用每 90 天轮换。要求 npm CLI ≥ 11.5.1、Node ≥ 22.14。
#
# 需要的配置：
#   - npmjs.com → ccstatusline-zh → Settings → Trusted Publisher → GitHub Actions：
#     仓库填本仓库，Workflow filename 填 `release.yml`，Environment 填 `npm-publish`，
#     并允许 `npm publish`（字段区分大小写，npm 保存时不校验，填错要到发布时才报错）
#   - Settings → Environments → 新建 `npm-publish`，加 Required reviewers（你自己）
#   - 过渡期保留 Secret NPM_TOKEN 作回退：npm 会先尝试 OIDC，失败才用 token。
#     确认某次发布的 `npm view ccstatusline-zh@<版本> _npmUser` 带 trustedPublisher 后，
#     删掉下面的 NODE_AUTH_TOKEN 和该 Secret。

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.v.outputs.should_publish }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare package.json version with npm
        id: v
        run: |
          LOCAL=$(jq -r .version package.json)
          NPM=$(npm view ccstatusline-zh version 2>/dev/null || echo '0.0.0')
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$NPM" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "📦 本地 $LOCAL ≠ npm $NPM —— 待发布"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "✅ npm 已是 $NPM —— 无需发布"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # 受保护 Environment —— 配了必需审批人后，这里会暂停等你批准
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Node 22 自带 npm 10.x，不支持 Trusted Publishing，升到 11.x
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # 过渡期回退，见文件头说明
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ needs.check.outputs.version }}"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION 已存在，跳过打 tag"
          else
            git tag "$VERSION"
            git push origin "$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION 已存在，跳过"
          else
            gh release create "$VERSION" \
              --title "$VERSION — 同步上游 ccstatusline" \
              --generate-notes
          fi
